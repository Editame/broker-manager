spring:
  # Database Configuration - SQLite
  datasource:
    url: jdbc:sqlite:./data/broker-manager.db
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    # HikariCP Configuration for SQLite - MÁS AGRESIVO
    hikari:
      maximum-pool-size: 1          # Solo 1 conexión para SQLite
      minimum-idle: 0               # Sin conexiones idle
      connection-timeout: 10000     # 10 segundos timeout
      idle-timeout: 30000           # 30 segundos idle
      max-lifetime: 300000          # 5 minutos max lifetime
      leak-detection-threshold: 10000  # 10 segundos para detectar leaks
      pool-name: SQLitePool
      auto-commit: true             # Auto commit habilitado
  
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        connection:
          autocommit: true          # Auto commit en Hibernate también
  
  # ActiveMQ (para testing interno)
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
    pool:
      enabled: false

# ActiveMQ JMX Configuration (fallback)
activemq:
  jmx:
    url: service:jmx:rmi:///jndi/rmi://localhost:1099/jmxrmi
    username: 
    password: 
    connection:
      timeout: 10000

# Logging
logging:
  level:
    com.editame.brokermanager: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    com.zaxxer.hikari: DEBUG        # Debug para HikariCP

