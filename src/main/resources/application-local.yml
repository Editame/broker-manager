spring:
  # Database Configuration - SQLite
  datasource:
    url: jdbc:sqlite:./data/broker-manager.db
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
  
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  
  # ActiveMQ (para testing interno)
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
    pool:
      enabled: false

# ActiveMQ JMX Configuration (fallback)
activemq:
  jmx:
    url: service:jmx:rmi:///jndi/rmi://localhost:1099/jmxrmi
    username: 
    password: 
    connection:
      timeout: 10000

# Logging
logging:
  level:
    com.editame.brokermanager: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

