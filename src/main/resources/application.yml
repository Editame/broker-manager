spring:
  application:
    name: broker-manager
  profiles:
    active: local
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        
  # Cache Configuration
  cache:
    type: simple
    cache-names:
      - brokerMetrics
      - queues
      - queue
      - messages

# ActiveMQ Configuration
activemq:
  jmx:
    url: service:jmx:rmi:///jndi/rmi://localhost:1099/jmxrmi
    username: 
    password: 
    connection:
      timeout: 5000

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    com.editame.brokermanager: DEBUG
    org.springframework.cache: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: app.log

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
